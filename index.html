<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>POV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6f7fb;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #fff;
      width: 320px;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .grid {
      background: repeating-linear-gradient(
        0deg,
        #eee,
        #eee 1px,
        transparent 1px,
        transparent 30px
      ),
      repeating-linear-gradient(
        90deg,
        #eee,
        #eee 1px,
        transparent 1px,
        transparent 30px
      );
      border-radius: 12px;
      padding: 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    img {
      width: 120px;
      height: auto;
    }
    .text {
      font-size: 18px;
      font-weight: 600;
      color: #7a2cff;
      margin-bottom: 10px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #7a2cff;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: #b48cff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <img id="sticker" src="https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif" alt="cat" />
      <div class="text" id="text">Chal chikne, photo bhej 😈📸</div>
      <div class="buttons" id="buttons">
        <button onclick="nextStep(true)">Yes</button>
        <button class="secondary" onclick="nextStep(false)">No</button>
      </div>
    </div>
  </div>

  <script>
    let step = 0;

    const scenes = [
      { text: "Chal chikne, photo bhej 😈📸", img: "https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif" },
      { text: "Plssss cutie 🥺", img: "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" },
      { text: "Bhej re ho 😒", img: "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" },
      { text: "Thanks zi 🐱✨", img: "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" }
    ];

    function nextStep(clickedYes) {
      // determine next slide based on Yes/No
      if(step === 0) {
        step = clickedYes ? 2 : 1; // if yes → Bhej re ho, if no → Plssss
      } else if(step === 1) {
        step = 2; // after Plssss → Bhej re ho
      } else if(step === 2) {
        step = 3; // after Bhej re ho → Thanks
      }

      document.getElementById("text").innerText = scenes[step].text;
      document.getElementById("sticker").src = scenes[step].img;

      // final slide only has one button
      if(step === 3) {
        document.getElementById("buttons").innerHTML =
          '<button onclick="alert(`Photo bhejne ka time aa gaya 😌📸`)">Ok</button>';
      }
    }
  </script>
</body>
</html>
